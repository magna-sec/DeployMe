---
- name: Copy bashrc for {{ ansible_user }}
  ansible.builtin.copy:
    src: bashrc
    dest: /home/{{ ansible_user }}/.bashrc
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Copy bashrc for root
  ansible.builtin.copy:
    src: bashrc
    dest: /root/.bashrc
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Change current user's shell to /bin/bash
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/bash

- name: Register ghostty as x-terminal-emulator alternative
  become: true
  ansible.builtin.command:
    cmd: update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator /usr/bin/ghostty 50
  args:
    creates: /etc/alternatives/x-terminal-emulator

- name: Set ghostty as default terminal
  become: true
  community.general.alternatives:
    name: x-terminal-emulator
    path: /usr/bin/ghostty

- name: Set ghostty as XFCE preferred terminal
  become: true
  ansible.builtin.lineinfile:
    path: /etc/xdg/xfce4/helpers.rc
    regexp: '^TerminalEmulator='
    line: 'TerminalEmulator=ghostty'
    create: true
    mode: '0644'

- name: Create ghostty config directory for {{ ansible_user }}
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.config/ghostty
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: '0755'

- name: Deploy ghostty config for {{ ansible_user }}
  ansible.builtin.template:
    src: ghostty.config.j2
    dest: /home/{{ ansible_user }}/.config/ghostty/config
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
