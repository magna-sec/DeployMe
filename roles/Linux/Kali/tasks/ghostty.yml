---
- name: Install Ghostty
  become: true
  block:
    - name: Download Ghostty deb package
      ansible.builtin.get_url:
        url: https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.3.1-0-ppa2/ghostty_1.3.1-0.ppa2_amd64_trixie.deb
        dest: /tmp/ghostty.deb
        mode: '0644'
        force: true

    - name: Install Ghostty deb package
      ansible.builtin.apt:
        deb: /tmp/ghostty.deb
        state: present

    - name: Clean up Ghostty deb
      ansible.builtin.file:
        path: /tmp/ghostty.deb
        state: absent
